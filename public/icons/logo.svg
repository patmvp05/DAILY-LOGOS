<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="112" fill="white" />
  
  <!-- Left Outer Page -->
  <path d="M256 350 L110 270 V130 L256 195 V350Z" fill="#120c7a" />
  
  <!-- Right Outer Page -->
  <path d="M256 350 L402 270 V130 L256 195 V350Z" fill="#0241db" />
  
  <!-- Left Inner Page -->
  <path d="M256 350 L150 286 V100 L256 168 V350Z" fill="#0281ff" />
  
  <!-- Right Inner Page -->
  <path d="M256 350 L362 286 V100 L256 168 V350Z" fill="#2dacf7" />

  <!-- Add subtle gradient/overlay for the shiny effect -->
  <path d="M256 350 L362 286 V100 L256 168 V350Z" fill="url(#shine)" fill-opacity="0.2" />
  
  <rect width="512" height="512" rx="112" fill="url(#glass)" />

  <defs>
    <linearGradient id="shine" x1="256" y1="168" x2="362" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.05" />
    </linearGradient>
  </defs>
</svg>
