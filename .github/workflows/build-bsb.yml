name: Build BSB (bereanbible.com bulk)

# The Berean Standard Bible needs no scraping: bereanbible.com publishes the
# whole text as ONE tab-separated file (~4.3 MB) dedicated to the public domain.
# One request replaces 1,189, so this finishes in seconds with no rate limiting,
# no partial runs and nothing to resume — unlike the BibleGateway scrapers.
#
# The builder refuses to write unless all 1,189 chapters parsed, so a truncated
# download can never commit a half-Bible that the app would paper over with a
# KJV fallback.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bsb.yml'
      - 'scripts/fetch-bsb-berean.mjs'
      - 'scripts/lib/bibleBooks.mjs'
  workflow_dispatch:

# Per-WORKFLOW concurrency, deliberately not a single shared group.
#
# GitHub keeps only ONE pending run per concurrency group: a newly queued run
# cancels the previously-pending one rather than lining up behind it. With all
# the scrapers sharing one group, dispatching a second scraper silently
# CANCELLED the first instead of queuing it. Each scraper writes to its own
# public/bible/{CODE}/ directory and its commit step rebase-retries, so they are
# safe to run at the same time; only a workflow racing ITSELF needs serialising.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build BSB static files
        run: node scripts/fetch-bsb-berean.mjs

      - name: Verify completeness before committing
        run: |
          HAVE=$(find public/bible/BSB -name '*.json' | wc -l | tr -d ' ')
          echo "BSB chapters built: ${HAVE} / 1189"
          [ "${HAVE}" -eq 1189 ] || { echo "::error::BSB incomplete (${HAVE}/1189)"; exit 1; }
          echo "--- spot check: Genesis 1:1 ---"
          head -c 300 public/bible/BSB/1/1.json; echo
          echo "--- spot check: Psalms 23 (source calls it 'Psalm') ---"
          head -c 300 public/bible/BSB/19/23.json; echo

      - name: Commit BSB static files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/bible/BSB/
          if git diff --cached --quiet; then
            echo "BSB already up to date"
          else
            COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -m "Add BSB Bible text from bereanbible.com (${COUNT} chapter files)"
            for attempt in 1 2 3 4 5; do
              if git push origin main; then echo "pushed"; break; fi
              echo "push rejected (attempt $attempt) — rebasing"
              git pull --rebase origin main || true
              [ "$attempt" = "5" ] && { echo "::error::could not push after 5 attempts"; exit 1; }
              sleep $((attempt * 5))
            done
          fi
