name: Fetch Static Bible Text

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Bible chapters from bolls.life
        run: node scripts/fetch-bible-static.mjs

      - name: Commit and push static Bible files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/bible/
          if git diff --cached --quiet; then
            echo "No new files to commit"
          else
            git commit -m "Add static Bible text for modern translations (NIV/ESV/NLT/NKJV/NCV)"
            git push origin main
          fi
