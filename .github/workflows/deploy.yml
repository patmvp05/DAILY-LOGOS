name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Firestore security rules ship BEFORE the hosting bundle that depends on
      # them: the hosting action deploys hosting only, so without this a client
      # using a new collection goes live against rules that still deny it.
      #
      # Non-blocking on purpose. The service account may lack the Firebase Rules
      # role (403), and a hard failure here would (a) leave hosting permanently
      # undeployed while the daily-devotional workflow ships the same commit
      # anyway, and (b) hide unrelated app fixes behind an IAM issue. Every
      # collection whose rules might lag is registered as an `optional` listener
      # in useFirestoreSync, so the app degrades to "that one feature doesn't
      # sync yet" instead of erroring. Rule *correctness* is already proven
      # pre-merge by the emulator suites (npm run test:rules).
      - name: Deploy Firestore rules
        id: rules
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules \
            --project gen-lang-client-0538747272 --non-interactive
          status=$?
          rm -f "$RUNNER_TEMP/firebase-sa.json"
          exit $status

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: gen-lang-client-0538747272

      # Hosting has shipped by this point, so app fixes are never held hostage to
      # an IAM problem — but the RUN MUST GO RED when rules did not publish.
      #
      # This previously only printed a ::warning:: and the job stayed green.
      # `continue-on-error: true` also makes a failed step report
      # conclusion=success (only `outcome` is failure), so the run looked
      # entirely successful while every write to a newly-added collection was
      # being denied in production. That is exactly how sprint sync shipped
      # against rules that rejected it.
      - name: Fail the run if Firestore rules did not deploy
        if: steps.rules.outcome == 'failure'
        run: |
          echo "::error title=Firestore rules were NOT deployed::Hosting shipped, but the \
          security rules did not. Cloud sync for any newly-added collection is DENIED in \
          production until this succeeds. If the log above shows HTTP 403 'The caller does \
          not have permission', grant the service account in FIREBASE_SERVICE_ACCOUNT the \
          'Firebase Rules Admin' role (roles/firebaserules.admin) in Google Cloud IAM, then \
          re-run this workflow."
          exit 1
