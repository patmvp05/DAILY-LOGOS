name: Download NIV/NLT/ESV/NKJV from BibleGateway (temporary, fix branch only)

# bolls.life now answers NIV requests with a notice instead of scripture, and its
# NLT/ESV text had leaked headings and lost poetry lines. These four come from
# BibleGateway instead (same parser as NCV/CSB). Output goes to audit/bgfull/
# for review; the audit/bg poetry-book copies are reused, not re-fetched.
# Deleted before merging. Re-run: change the "run" number and push.  run: 1

on:
  push:
    branches: ['fix/bible-text-integrity']
    paths: ['.github/workflows/rescrape-bg-full.yml']

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: [NIV, NLT, ESV, NKJV]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bible-text-integrity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/test-biblegateway-parser.py
      - name: Reuse the poetry-book copies already downloaded
        run: |
          mkdir -p audit/bgfull/${{ matrix.version }}
          if [ -d audit/bg/${{ matrix.version }} ]; then cp -rn audit/bg/${{ matrix.version }}/. audit/bgfull/${{ matrix.version }}/; fi
          find audit/bgfull/${{ matrix.version }} -name '*.json' | wc -l
      - name: Smoke (${{ matrix.version }})
        env: { SMOKE: '1', BG_VERSION: '${{ matrix.version }}' }
        run: python scripts/fetch-biblegateway.py
      - name: Download ${{ matrix.version }}
        continue-on-error: true
        timeout-minutes: 52
        env: { BG_VERSION: '${{ matrix.version }}', OUT_ROOT: 'audit/bgfull', REFETCH: '1', DELAY: '1.5' }
        run: python scripts/fetch-biblegateway.py
      - name: Commit
        if: always()
        run: bash .github/scripts/commit-to-fix-branch.sh "audit/bgfull/${{ matrix.version }}" "BibleGateway ${{ matrix.version }} for review"
