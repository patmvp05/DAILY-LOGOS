name: Re-download Bible text (temporary, fix branch only)

# One-time repair, Oct 2026. Runs only on the fix branch and is deleted before
# merging. NCV and CSB come from BibleGateway with the fixed parser (combined
# verses, spacing); NIV/NLT/ESV/NKJV from bolls with the fixed heading filter.
# ESV/NKJV/NLT poetry books are also fetched from BibleGateway into audit/ as an
# independent second copy to compare against. Every chapter must pass the
# completeness check or it is not written.
# Re-run: change the "run" number below and push.  run: 1

on:
  push:
    branches: ['fix/bible-text-integrity']
    paths: ['.github/workflows/rescrape-bible-text.yml']

permissions:
  contents: write

jobs:
  biblegateway:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: [NCV, CSB]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bible-text-integrity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Smoke (${{ matrix.version }})
        env: { SMOKE: '1', BG_VERSION: '${{ matrix.version }}' }
        run: python scripts/fetch-biblegateway.py
      - name: Re-download ${{ matrix.version }}
        continue-on-error: true
        timeout-minutes: 52
        env: { BG_VERSION: '${{ matrix.version }}', REFETCH: '1', DELAY: '1.0' }
        run: python scripts/fetch-biblegateway.py
      - name: Commit
        if: always()
        run: bash .github/scripts/commit-to-fix-branch.sh "public/bible/${{ matrix.version }}" "Re-download ${{ matrix.version }} with the fixed parser"

  bolls:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version: [NIV, NLT, ESV, NKJV]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bible-text-integrity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-download ${{ matrix.version }}
        continue-on-error: true
        timeout-minutes: 52
        env: { ONLY_VERSION: '${{ matrix.version }}', REFETCH: '1', AUDIT_DIR: 'audit' }
        run: node scripts/fetch-bible-static.mjs
      - name: Commit
        if: always()
        run: bash .github/scripts/commit-to-fix-branch.sh "public/bible/${{ matrix.version }} audit" "Re-download ${{ matrix.version }} with the fixed heading filter"

  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: [ESV, NKJV, NLT]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bible-text-integrity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Second copy of ${{ matrix.version }} poetry books from BibleGateway
        continue-on-error: true
        timeout-minutes: 52
        env:
          BG_VERSION: '${{ matrix.version }}'
          OUT_ROOT: audit/bg
          ONLY_BOOKS: 'Job,Psalms,Proverbs,Ecclesiastes,Song of Solomon,Isaiah,Lamentations,Hosea,Amos,Micah,Numbers,Ruth,Jonah,Mark,Philippians,James'
          DELAY: '1.0'
        run: python scripts/fetch-biblegateway.py
      - name: Commit
        if: always()
        run: bash .github/scripts/commit-to-fix-branch.sh "audit/bg/${{ matrix.version }}" "Audit copy of ${{ matrix.version }} from BibleGateway"
