name: Probe BibleGateway combined verses (temporary)
on:
  push:
    branches: ['probe/bg-combined-verses']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python probe/bg_probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe/out
          git commit -m "Probe output" || echo "nothing to commit"
          git push origin HEAD:probe/bg-combined-verses
